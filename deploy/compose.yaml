services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable GHCR image tag}
    container_name: 3d-printer-site
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - '0.0.0.0:5003:3000'
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
