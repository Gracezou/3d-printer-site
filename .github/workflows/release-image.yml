name: Release container image
run-name: Release image [${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'stage' }}] ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Build-time configuration environment
        required: true
        type: choice
        options:
          - stage
          - production
  push:
    branches:
      - dev-0.2
      - release-v0.2.1
      - release-v0.2.2
      - release-v0.3.0

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'stage' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'stage' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Environment build config
        env:
          BUILD_CONFIG: ${{ vars.BUILD_CONFIG }}
        run: pnpm exec tsx scripts/resolve-build-config.ts "$DEPLOY_ENVIRONMENT"

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm security:audit

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          ref_name="$GITHUB_REF_NAME"
          if [[ "$ref_name" =~ ^release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          elif [[ "$ref_name" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          else
            release_version="$(node -p "require('./package.json').version")"
          fi
          echo "app_version=v${release_version}+sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_ENVIRONMENT }}-sha-${{ github.sha }}
            ${{ env.DEPLOY_ENVIRONMENT == 'stage' && format('{0}:sha-{1}', env.IMAGE_NAME, github.sha) || '' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ICP_LICENSE=${{ env.NEXT_PUBLIC_ICP_LICENSE }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
